<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Box - Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            padding: 35px;
            background: #111;
            border: 1px solid #555;
            border-radius: 10px;
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .text {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            background: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .box {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">SCREEN BOX</div>

        <h2>Forgot Password?</h2>

        <p class="text">
            Enter your email address to reset your password.
        </p>

        <form onsubmit="resetPassword(event)">

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">RESET PASSWORD</button>

        </form>

        <a href="login.html" class="back">
            ← Back to Login
        </a>

    </div>

    <script>
        function resetPassword(event) {
            event.preventDefault();

            alert("Password reset link sent to your email!");
        }
    </script>

</body>
</html>
