<!DOCTYPE html>
<html>
<head>
    <title>Screen Box - TV Shows</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
        body{background:#000;color:white}

        nav{
            padding:18px 5%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #333
        }

        .logo{font-size:25px;font-weight:bold}
        nav a{color:white;text-decoration:none;margin:0 8px;font-size:14px}

        .page{padding:40px 5%}
        .page>p{color:#aaa;margin:10px 0 30px}

        .shows{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px
        }

        .card{
            background:#111;
            border:1px solid #444;
            border-radius:8px;
            overflow:hidden
        }

        .image{
            height:220px;
            background:#222;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#888
        }

        .info{padding:15px}
        .info p{color:#aaa;font-size:13px;margin:8px 0 12px}

        button{
            padding:9px 12px;
            border:0;
            border-radius:4px;
            cursor:pointer
        }

        .add{background:#222;color:white;border:1px solid #555}

        @media(max-width:900px){
            .shows{grid-template-columns:repeat(2,1fr)}
        }

        @media(max-width:600px){
            nav{flex-direction:column;gap:15px}
            .shows{grid-template-columns:1fr}
        }
    </style>
    <script>
        if (sessionStorage.getItem("screenBoxAuthenticated") !== "true") {
            window.location.replace("login.html");
        }
    </script>
</head>

<body>

<nav>
    <b class="logo">SCREEN BOX</b>

    <div>
        <a href="home.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="tv-shows.html">TV Shows</a>
        <a href="sports.html">Sports</a>
        <a href="search.html">Search</a>
        <a href="watchlist.html">Watchlist</a>
    </div>

    <a href="profile.html">Profile</a>
</nav>

<div class="page">

    <h1>TV Shows</h1>
    <p>Explore TV shows available on Screen Box.</p>

    <div class="shows">

        <script>
            let shows=[
                "TV Show One","TV Show Two","TV Show Three","TV Show Four",
                "TV Show Five","TV Show Six","TV Show Seven","TV Show Eight"
            ];

            shows.forEach(show=>{
                document.write(`
                    <div class="card">
                        <div class="image">Show Image</div>

                        <div class="info">
                            <h3>${show}</h3>
                            <p>Drama • Season 1 • 10 Episodes</p>

                            <button onclick="watch()">Watch</button>

                            <button class="add"
                                onclick="add('${show}')">
                                + Watchlist
                            </button>
                        </div>
                    </div>
                `);
            });

            function watch(){
                location.href="content-details.html";
            }

            function add(show){
                alert(show+" added to Watchlist!");
            }
        </script>

    </div>
</div>

</body>
</html>
