<!DOCTYPE html>
<html>
<head>
    <title>Screen Box - Sports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
        body{background:#000;color:white}

        nav{
            padding:18px 5%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #333
        }

        .logo{font-size:25px;font-weight:bold}
        nav a{color:white;text-decoration:none;margin:0 8px;font-size:14px}

        .page{padding:40px 5%}
        .page>p{color:#aaa;margin:10px 0 30px}

        .sports{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px
        }

        .card{
            background:#111;
            border:1px solid #444;
            border-radius:8px;
            padding:20px;
            min-height:220px
        }

        .image{
            height:130px;
            background:#222;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#888;
            margin-bottom:15px
        }

        .card p{
            color:#aaa;
            font-size:13px;
            margin:8px 0 15px
        }

        button{
            padding:9px 15px;
            border:0;
            border-radius:4px;
            cursor:pointer
        }

        @media(max-width:900px){
            .sports{grid-template-columns:repeat(2,1fr)}
        }

        @media(max-width:600px){
            nav{flex-direction:column;gap:15px}
            .sports{grid-template-columns:1fr}
        }
    </style>
    <script>
        if (sessionStorage.getItem("screenBoxAuthenticated") !== "true") {
            window.location.replace("login.html");
        }
    </script>
</head>

<body>

<nav>
    <b class="logo">SCREEN BOX</b>

    <div>
        <a href="home.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="tv-shows.html">TV Shows</a>
        <a href="sports.html">Sports</a>
        <a href="search.html">Search</a>
        <a href="watchlist.html">Watchlist</a>
    </div>

    <a href="profile.html">Profile</a>
</nav>

<div class="page">

    <h1>Sports</h1>
    <p>Watch your favorite sports on Screen Box.</p>

    <div class="sports">

        <script>
            let sports=[
                "Football",
                "Cricket",
                "Formula 1",
                "Tennis",
                "Basketball",
                "Wrestling",
                "Boxing",
                "More Sports"
            ];

            sports.forEach(sport=>{
                document.write(`
                    <div class="card">
                        <div class="image">${sport}</div>
                        <h3>${sport}</h3>
                        <p>Live & Upcoming Events</p>
                        <button onclick="watch()">Watch</button>
                    </div>
                `);
            });

            function watch(){
                location.href="content-details.html";
            }
        </script>

    </div>
</div>

</body>
</html>
