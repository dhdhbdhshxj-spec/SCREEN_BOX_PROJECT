<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Box - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            padding: 35px;
            border: 1px solid #555;
            border-radius: 10px;
            text-align: center;
            background-color: #111;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            background: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: white;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        a {
            color: white;
            text-decoration: none;
        }

        .links {
            margin-top: 20px;
            font-size: 14px;
        }

        .links p {
            margin: 10px 0;
            color: #aaa;
        }

        @media (max-width: 500px) {
            .login-box {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">SCREEN BOX</div>

        <p class="subtitle">Welcome back</p>

        <form onsubmit="login(event)">

            <input type="email" id="email" placeholder="Email" required>

            <input type="password" id="password" placeholder="Password" required>

            <button type="submit">LOGIN</button>

        </form>

        <div class="links">
            <p>
                <a href="forgot-password.html">Forgot Password?</a>
            </p>

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            if (email && password) {
                alert("Login Successful!");
                window.location.href = "home.html";
            }
        }
    </script>

</body>
</html>
